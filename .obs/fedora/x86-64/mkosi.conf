# needssslcertforbuild

# This exported recipe is dependency metadata for OBS. mkosi 26 builds the
# canonical mkosi.conf from the SCM tree; mkosi.obs.conf detects the OBS
# project certificate there and enables deferred signing for each final image.
[Config]
Dependencies=webserver,mailserver

# OBS resolves build dependencies only from this exported top-level recipe.
# BuildPackages is therefore the complete graph package closure. There are no
# BuildScripts, so mkosi never installs this dependency-only list; the actual
# graph nodes install only their base, initrd, or role-specific payloads.
[Content]
BuildPackages=
        authselect
        bash
        btrfs-progs
        ca-certificates
        certbot
        chrony
        coreutils
        cryptsetup
        dbus-broker
        dosfstools
        e2fsprogs
        fedora-release
        findutils
        gnupg2
        hardened_malloc
        ipe-policy
        kernel-core
        kmod
        less
        libcurl-minimal
        libfdisk
        libfido2
        nftables
        nginx-core
        no_rlimit_as
        openssh-server
        openssl
        pam
        policycoreutils
        polkit
        postgresql-contrib
        postgresql-server
        procps-ng
        sed
        selinux-policy-targeted
        stalwart
        systemd
        systemd-boot
        systemd-container
        systemd-networkd
        systemd-networkd-defaults
        systemd-oomd-defaults
        systemd-pam
        systemd-resolved
        tpm2-tss
        udev
        util-linux
        veritysetup
        xfsprogs
