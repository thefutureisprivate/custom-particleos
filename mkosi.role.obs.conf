# mkosi-obs itself contains main-image-only build settings. Apply its supported
# first-pass output policy to each complete role and invoke the packaged signer
# through a location-independent adapter.
[Match]
PathExists=/usr/src/packages/SOURCES/_projectcert.crt

[Output]
CompressOutput=zstd

[Validation]
SecureBoot=no
SignExpectedPcr=no
Verity=defer
Checksum=yes

[Content]
ExtraTrees=%D/mkosi.obs.extra
PostOutputScripts=%D/mkosi.scripts/particleos-obs-postoutput
