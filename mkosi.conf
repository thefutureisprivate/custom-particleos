# The main image is a non-installing aggregate. It requests complete role
# images; each role independently includes mkosi.role.conf.
[Config]
MinimumVersion=26~devel
Dependencies=webserver,mailserver

[Distribution]
Distribution=fedora
Release=44
Architecture=x86-64
Mirror=https://dl.fedoraproject.org/pub/fedora

[Build]
ToolsTree=default
ToolsTreeMirror=https://download.opensuse.org
ToolsTreeProfiles=misc,runtime
History=yes
CacheDirectory=mkosi.cache
Incremental=yes

[Output]
OutputDirectory=mkosi.output
Format=none
Overlay=no
ManifestFormat=
SplitArtifacts=

[Content]
Bootable=no
SELinuxRelabel=no

[Runtime]
RuntimeSize=12G
RAM=2G
CPUs=2
Ephemeral=yes

# Load the upstream OBS build/signing machinery only on the aggregate image;
# current mkosi-obs carries main-image-only build settings.
[Include]
Include=%D/mkosi.obs.conf

[Output]
# Complete role images invoke the signer independently.
SplitArtifacts=

[Content]
PostOutputScripts=
