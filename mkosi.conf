[Config]
MinimumVersion=26~devel
Dependencies=initrd

[Distribution]
Distribution=fedora
Release=44
Architecture=x86-64
Mirror=https://dl.fedoraproject.org/pub/fedora

[Build]
ToolsTree=default
ToolsTreeMirror=https://download.opensuse.org
ToolsTreeProfiles=misc,runtime
History=yes
CacheDirectory=mkosi.cache
Incremental=yes

[Output]
OutputDirectory=mkosi.output
SplitArtifacts=
SplitArtifacts=uki,partitions,roothash,os-release,repart-definitions
Format=disk
ImageId=ParticleOS-Webserver
ManifestFormat=json
Output=%i_%v_%a

[Content]
SELinuxRelabel=yes
WithDocs=no
WithRecommends=no
ExtraTrees=mkosi.resources:/usr/lib/particleos/sysupdate-key-source
UnifiedKernelImageFormat=%i_%v_%a
Initrds=%O/initrd
KernelCommandLine=
        root=dissect
        mount.usr=dissect
        rw
        audit=1
        audit_backlog_limit=8192
        enforcing=1
        selinux=1
        systemd.verity_usr_options=root-hash-signature=auto
        systemd.image_policy=esp=unprotected:xbootldr=unprotected+unused+absent:usr=signed:root=encrypted+absent:swap=encrypted+unused+absent:home=absent:=ignore
        systemd.image_filter=usr=ParticleOS-Webserver_*:usr-verity=ParticleOS-Webserver_*:usr-verity-sig=ParticleOS-Webserver_*:root=ParticleOS-Webserver-*:swap=ParticleOS-Webserver-*
        ipe.enforce=1
        slab_nomerge
        init_on_alloc=1
        init_on_free=1
        page_alloc.shuffle=1
        randomize_kstack_offset=on
        module.sig_enforce=1
        rd.shell=0
        rd.emergency=halt
        lockdown=confidentiality
        vsyscall=none
        ia32_emulation=0
        fb_tunnels=none
        noautogroup
KernelInitrdModules=default
Hostname=particle-web-????-????

Packages=
        bash
        ca-certificates
        certbot
        chrony
        coreutils
        dbus-broker
        findutils
        gnupg2
        hardened_malloc
        kmod
        nftables
        nginx-core
        no_rlimit_as
        openssh-server
        polkit
        sed
        systemd
        systemd-container
        udev
        util-linux

RemoveFiles=
        /etc/profile.d/gnupg2.csh
        /etc/profile.d/gnupg2.sh
        /usr/lib/particleos/sysupdate-key-source
        /usr/bin/arping
        /usr/bin/chage
        /usr/bin/chfn
        /usr/bin/chsh
        /usr/bin/clockdiff
        /usr/bin/gpasswd
        /usr/bin/importctl
        /usr/bin/machinectl
        /usr/bin/mount.ddi
        /usr/bin/newgidmap
        /usr/bin/newgrp
        /usr/bin/newuidmap
        /usr/bin/pam_timestamp_check
        /usr/bin/passwd
        /usr/bin/pkexec
        /usr/bin/portablectl
        /usr/bin/su
        /usr/bin/systemd-dissect
        /usr/bin/systemd-nspawn
        /usr/bin/systemd-vmspawn
        /usr/lib/libnss_mymachines.so.2
        /usr/lib64/libnss_mymachines.so.2
        /usr/lib/systemd/system-generators/systemd-import-generator
        /usr/lib/systemd/system/dbus-org.freedesktop.import1.service
        /usr/lib/systemd/system/dbus-org.freedesktop.machine1.service
        /usr/lib/systemd/system/machine.slice
        /usr/lib/systemd/system/machines.target
        /usr/lib/systemd/system/machines.target.wants
        /usr/lib/systemd/system/remote-fs.target.wants/var-lib-machines.mount
        /usr/lib/systemd/system/sockets.target.wants/systemd-importd.socket
        /usr/lib/systemd/system/sockets.target.wants/systemd-machined.socket
        /usr/lib/systemd/system/systemd-importd.service
        /usr/lib/systemd/system/systemd-importd.socket
        /usr/lib/systemd/system/systemd-machined.service
        /usr/lib/systemd/system/systemd-machined.socket
        /usr/lib/systemd/system/systemd-mountfsd.service
        /usr/lib/systemd/system/systemd-mountfsd.socket
        /usr/lib/systemd/system/systemd-nspawn@.service
        /usr/lib/systemd/system/systemd-nsresourced.service
        /usr/lib/systemd/system/systemd-nsresourced.socket
        /usr/lib/systemd/system/systemd-vmspawn@.service
        /usr/lib/systemd/system/var-lib-machines.mount
        /usr/lib/systemd/systemd-export
        /usr/lib/systemd/systemd-import
        /usr/lib/systemd/systemd-import-fs
        /usr/lib/systemd/systemd-importd
        /usr/lib/systemd/systemd-machined
        /usr/lib/systemd/systemd-mountfsd
        /usr/lib/systemd/systemd-mountwork
        /usr/lib/systemd/systemd-nsresourced
        /usr/lib/systemd/systemd-nsresourcework
        /usr/lib/systemd/user/dbus-org.freedesktop.import1.service
        /usr/lib/systemd/user/dbus-org.freedesktop.machine1.service
        /usr/lib/systemd/user/machine.slice
        /usr/lib/systemd/user/machines.target
        /usr/lib/systemd/user/sockets.target.wants/systemd-importd.socket
        /usr/lib/systemd/user/sockets.target.wants/systemd-machined.socket
        /usr/lib/systemd/user/systemd-importd.service
        /usr/lib/systemd/user/systemd-importd.socket
        /usr/lib/systemd/user/systemd-machined.service
        /usr/lib/systemd/user/systemd-machined.socket
        /usr/lib/systemd/user/systemd-nspawn@.service
        /usr/lib/systemd/user/systemd-vmspawn@.service
        /usr/lib/tmpfiles.d/systemd-nspawn.conf
        /usr/share/dbus-1/interfaces/org.freedesktop.import1.*
        /usr/share/dbus-1/interfaces/org.freedesktop.machine1.*
        /usr/share/dbus-1/services/org.freedesktop.import1.service
        /usr/share/dbus-1/services/org.freedesktop.machine1.service
        /usr/share/dbus-1/system-services/org.freedesktop.import1.service
        /usr/share/dbus-1/system-services/org.freedesktop.machine1.service
        /usr/share/dbus-1/system.d/org.freedesktop.import1.conf
        /usr/share/dbus-1/system.d/org.freedesktop.machine1.conf
        /usr/share/gnupg/help.*.txt
        /usr/share/gnupg/help.txt
        /usr/share/polkit-1/actions/org.freedesktop.import1.policy
        /usr/share/polkit-1/actions/org.freedesktop.machine1.policy
        /var/lib/machines

VolatilePackages=
        systemd
        udev

[Validation]
SecureBoot=yes
SignExpectedPcr=no

[Runtime]
RuntimeSize=12G
RAM=2G
CPUs=2
Ephemeral=yes
