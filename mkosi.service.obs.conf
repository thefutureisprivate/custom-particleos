# Apply the same authoritative OBS deferred verity-signing pipeline to the
# standalone application DDI without adding host-OS sysupdate definitions.
[Match]
PathExists=/usr/src/packages/SOURCES/_projectcert.crt

[Output]
CompressOutput=zstd

[Validation]
SecureBoot=no
SignExpectedPcr=no
Verity=defer
Checksum=yes

[Content]
PostOutputScripts=%D/mkosi.scripts/particleos-obs-postoutput
