# GrapheneOS-derived network defaults, with strict RPF enforced by nftables.
net.ipv6.bindv6only = 1
net.ipv4.ip_local_port_range = 1024 65535

net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0
net.ipv6.conf.default.forwarding = 0

net.ipv4.conf.*.send_redirects = 0
net.ipv4.conf.*.accept_redirects = 0
net.ipv4.conf.*.secure_redirects = 0
net.ipv6.conf.*.accept_redirects = 0
net.ipv4.conf.*.accept_source_route = 0
net.ipv6.conf.*.accept_source_route = 0
net.ipv4.conf.*.route_localnet = 0
net.ipv4.conf.*.accept_local = 0
net.ipv4.conf.*.log_martians = 1

# nftables fib expressions cover both address families consistently.
net.ipv4.conf.default.rp_filter = 0
net.ipv4.conf.*.rp_filter = 0

net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.tcp_syncookies = 1

net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_ecn = 0
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_shrink_window = 1
net.ipv4.tcp_notsent_lowat = 131072
net.ipv4.tcp_fin_timeout = 30
net.ipv4.tcp_rfc1337 = 1
net.ipv4.tcp_tw_reuse = 1

# 31 seconds with the initial 1 second RTO.
net.ipv4.tcp_syn_retries = 4
-net.netfilter.nf_conntrack_tcp_timeout_syn_sent = 31

# 15 seconds with the initial 1 second RTO.
net.ipv4.tcp_synack_retries = 3
-net.netfilter.nf_conntrack_tcp_timeout_syn_recv = 15

# 102.2 seconds with the minimum 0.2 second RTO.
net.ipv4.tcp_retries2 = 8

# 25.4 seconds with the minimum 0.2 second RTO.
net.ipv4.tcp_orphan_retries = 6

-net.mptcp.enabled = 0
-net.netfilter.nf_conntrack_helper = 0
-net.netfilter.nf_conntrack_expect_max = 0
-net.netfilter.nf_conntrack_tcp_loose = 0
-net.netfilter.nf_conntrack_tcp_be_liberal = 0
-net.netfilter.nf_conntrack_tcp_timeout_established = 1800
-net.netfilter.nf_conntrack_tcp_timeout_time_wait = 60
-net.netfilter.nf_conntrack_udp_timeout = 15

# Do not allocate oversized default socket buffers.
net.core.rmem_default = 212992
net.core.wmem_default = 212992
