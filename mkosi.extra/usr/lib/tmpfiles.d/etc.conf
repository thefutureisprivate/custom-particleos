# Immutable vendor configuration is linked from /usr.
L /etc/os-release - - - - ../usr/lib/os-release
L+ /etc/mtab - - - - ../proc/self/mounts
L /etc/locale.conf
L /etc/nsswitch.conf
L+ /etc/resolv.conf - - - - ../run/systemd/resolve/stub-resolv.conf
L /etc/profile
L /etc/profile.d
L /etc/security
L? /etc/bashrc
L? /etc/bash.bashrc
L? /etc/bash.bash_logout
L? /etc/bash_completion.d
L? /etc/ca-certificates
L? /etc/crypto-policies
L? /etc/pki
L /etc/ssh/ssh_config
L /etc/ssh/ssh_config.d
L /etc/ssh/sshd_config
L /etc/ssh/sshd_config.d
L /etc/ssl
L /etc/environment
L? /etc/authselect
L? /etc/services
L? /etc/selinux
L? /etc/nginx
L? /etc/chrony.conf
L? /etc/sysconfig/chronyd

# Per-machine administration policy and TLS material remain writable.
d /etc/particleos 0700 root root -
C /etc/particleos/ssh-allowlist.nft 0600 root root - /usr/lib/particleos/ssh-allowlist.nft
d /etc/letsencrypt 0700 certbot certbot -
C /etc/letsencrypt/cli.ini 0600 certbot certbot - /usr/lib/particleos/certbot/cli.ini
Z /etc/letsencrypt - certbot certbot -
d /var/lib/letsencrypt 0700 certbot certbot -
Z /var/lib/letsencrypt - certbot certbot -
d /var/log/letsencrypt 0700 certbot certbot -
Z /var/log/letsencrypt - certbot certbot -
d /run/particleos-certbot 0750 certbot root -
d /var/lib/particleos 0700 root root -
d /var/lib/particleos/nginx 0700 root root -
d /var/lib/particleos/nginx/conf.d 0700 root root -

# Keep public content on Fedora's standard httpd_sys_content_t path. Certbot's
# systemd sandbox grants write access only to the pre-created challenge leaf.
d /var/www 0755 root root -
d /var/www/html 0755 root root -
d /var/www/html/.well-known 0755 root root -
d /var/www/html/.well-known/acme-challenge 0750 certbot root -
C /var/www/html/index.html 0644 root root - /usr/share/nginx/html/index.html
Z /var/www/html - - - -
