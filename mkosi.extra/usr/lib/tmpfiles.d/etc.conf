# Immutable vendor configuration is linked from /usr.
L /etc/os-release - - - - ../usr/lib/os-release
L+ /etc/mtab - - - - ../proc/self/mounts
L /etc/locale.conf
L /etc/nsswitch.conf
L+ /etc/resolv.conf - - - - ../run/systemd/resolve/stub-resolv.conf
L /etc/profile
L /etc/profile.d
L /etc/security
L? /etc/bashrc
L? /etc/bash.bashrc
L? /etc/bash.bash_logout
L? /etc/bash_completion.d
L? /etc/ca-certificates
L? /etc/crypto-policies
L? /etc/pki
L /etc/ssh/ssh_config
L /etc/ssh/ssh_config.d
L /etc/ssh/sshd_config
L /etc/ssh/sshd_config.d
L /etc/ssl
L /etc/environment
L /etc/ld.so.preload
L? /etc/authselect
L? /etc/protocols
L? /etc/services
L? /etc/selinux
L? /etc/chrony.conf
L? /etc/sysconfig/chronyd

# Per-machine administration policy remains writable.
d /etc/particleos 0700 root root -
C /etc/particleos/ssh-allowlist.nft 0600 root root - /usr/lib/particleos/ssh-allowlist.nft
d /var/lib/particleos 0700 root root -
