user nginx;
worker_processes auto;
worker_rlimit_nofile 32768;
worker_shutdown_timeout 1d;
daemon off;

error_log stderr warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 4096;
    multi_accept off;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types_hash_max_size 4096;

    charset utf-8;
    charset_types text/css text/javascript text/plain text/xml application/atom+xml application/json;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status '
                    '$body_bytes_sent "$http_referer" "$http_user_agent" '
                    '$request_time "$http3"';
    access_log /dev/stdout main;

    server_tokens off;
    autoindex off;
    keepalive_requests 16;
    keepalive_timeout 5s;
    reset_timedout_connection on;

    client_max_body_size 1k;
    client_body_buffer_size 1k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 4k;
    client_body_timeout 15s;
    client_header_timeout 10s;
    send_timeout 30s;

    max_ranges 1;
    sendfile on;
    tcp_nopush on;

    limit_conn_status 429;
    limit_conn_zone $binary_remote_addr zone=per_address:10m;
    limit_req_status 429;
    limit_req_zone $binary_remote_addr zone=requests_per_address:10m rate=20r/s;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_conf_command Options PrioritizeChaCha;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;
    http3_max_concurrent_streams 32;
    quic_active_connection_id_limit 2;

    include /usr/lib/particleos/nginx/conf.d/*.conf;
    include /var/lib/particleos/nginx/conf.d/*.conf;
}
