server {
    listen 80 default_server reuseport;
    listen [::]:80 default_server reuseport;
    server_name _;

    root /var/www/html;
    index index.html;

    include /usr/lib/particleos/nginx/snippets/security-headers.conf;

    location ^~ /.well-known/acme-challenge/ {
        limit_except GET HEAD {
            deny all;
        }

        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }

    location ~ (^|/)\. {
        deny all;
    }
}

# Reject TLS and QUIC handshakes for names without an explicitly provisioned
# virtual host. The QUIC listeners own SO_REUSEPORT for all HTTPS servers.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    listen 443 quic reuseport default_server;
    listen [::]:443 quic reuseport default_server;
    http2 on;
    server_name _;
    ssl_reject_handshake on;
}
