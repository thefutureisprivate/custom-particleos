#!/usr/bin/nft -f

flush ruleset

table inet particleos_filter {
    include "/etc/particleos/ssh-allowlist.nft"

    # Connection-count state is tied to conntrack lifetime. Do not add a set
    # timeout: nftables connlimits require dynamic sets without one.
    set web_tcp_conn4 {
        type ipv4_addr
        size 4096
        flags dynamic
    }

    set web_tcp_conn6 {
        type ipv6_addr
        size 4096
        flags dynamic
    }

    # PID 1 maintains this set from systemd-sysupdate.service's cgroup. This
    # grants the root updater HTTPS without granting every root process egress.
    set sysupdate_cgroups {
        type cgroupsv2
        size 4
    }

    chain prerouting_raw {
        type filter hook prerouting priority raw; policy drop;

        # Preserve IPv6 duplicate-address detection before strict RPF. ICMP is
        # statelessly rate-limited in input and never consumes conntrack state.
        ip6 saddr :: meta l4proto ipv6-icmp notrack accept

        # Strict reverse-path filtering for IPv4 and IPv6.
        fib saddr . iif oif missing counter drop
        iifname "lo" notrack accept

        # Enforce a strong host model after permitting loopback.
        fib daddr . iif type != { local, broadcast, multicast } counter drop

        ip protocol icmp notrack accept
        meta l4proto ipv6-icmp notrack accept

        # Admit only exposed TCP SYNs before conntrack. ACK/RST traffic is
        # required for locally initiated TCP connections and is rejected later
        # unless it belongs to a valid flow (nf_conntrack_tcp_loose=0).
        tcp flags & (fin | syn | rst | ack) == syn tcp dport { 22, 80, 443 } accept
        tcp flags & ack == ack accept
        tcp flags & rst == rst accept

        # QUIC and exact DHCP client tuples are the only inbound UDP services.
        udp dport { 443, 68, 546 } accept
        # Bound spoofed reply traffic before it can allocate conntrack state.
        # These ceilings are intentionally far above expected VPS time-sync
        # and DHCP traffic while remaining below nf_conntrack_max at the
        # configured UDP timeout. DNS uses authenticated TCP/853 exclusively.
        udp sport 123 limit rate over 128/second burst 256 packets counter drop
        udp sport { 67, 547 } limit rate over 32/second burst 64 packets counter drop

        # NTP and DHCP replies must reach conntrack before input validates that
        # they belong to locally initiated traffic.
        udp sport { 67, 123, 547 } accept
    }

    chain input {
        type filter hook input priority filter; policy drop;

        ct state invalid counter drop
        iifname "lo" accept
        ct state { established, related } accept

        # DHCP is required for generic VPS networking.
        meta nfproto ipv4 udp sport 67 udp dport 68 accept
        meta nfproto ipv6 udp sport 547 udp dport 546 accept

        ip protocol icmp limit rate 100/second burst 200 packets accept
        meta l4proto ipv6-icmp limit rate 100/second burst 200 packets accept

        tcp flags & (fin | syn | rst | ack) != syn ct state new counter drop
        meta nfproto ipv4 tcp dport { 80, 443 } ct state new add @web_tcp_conn4 { ip saddr ct count over 64 } counter drop
        meta nfproto ipv6 tcp dport { 80, 443 } ct state new add @web_tcp_conn6 { ip6 saddr ct count over 64 } counter drop
        tcp dport { 80, 443 } ct state new ct count over 2048 counter drop
        meta nfproto ipv4 tcp dport { 80, 443 } ct state new meter web_tcp4 size 65535 { ip saddr timeout 1m limit rate over 8/second burst 32 packets } counter drop
        meta nfproto ipv6 tcp dport { 80, 443 } ct state new meter web_tcp6 size 65535 { ip6 saddr timeout 1m limit rate over 8/second burst 32 packets } counter drop
        tcp dport { 80, 443 } ct state new limit rate over 128/second burst 256 packets counter drop
        tcp dport { 80, 443 } ct state new accept

        meta nfproto ipv4 udp dport 443 ct state new meter web_quic4 size 65535 { ip saddr timeout 1m limit rate over 32/second burst 64 packets } counter drop
        meta nfproto ipv6 udp dport 443 ct state new meter web_quic6 size 65535 { ip6 saddr timeout 1m limit rate over 32/second burst 64 packets } counter drop
        udp dport 443 ct state new limit rate over 256/second burst 512 packets counter drop
        udp dport 443 ct state new accept

        ip saddr @ssh_ipv4 tcp dport 22 ct state new meter ssh4 size 65535 { ip saddr timeout 5m limit rate over 4/minute burst 4 packets } counter drop
        ip6 saddr @ssh_ipv6 tcp dport 22 ct state new meter ssh6 size 65535 { ip6 saddr timeout 5m limit rate over 4/minute burst 4 packets } counter drop
        ip saddr @ssh_ipv4 tcp dport 22 ct state new accept
        ip6 saddr @ssh_ipv6 tcp dport 22 ct state new accept

        counter drop
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy drop;

        oifname "lo" accept
        ct state invalid counter drop
        ct state { established, related } accept

        meta skuid systemd-network udp dport { 67, 547 } accept
        meta skuid systemd-resolve ip daddr { 1.1.1.1, 1.0.0.1 } tcp dport 853 accept
        meta skuid systemd-resolve ip6 daddr { 2606:4700:4700::1111, 2606:4700:4700::1001 } tcp dport 853 accept
        meta skuid chrony udp dport 123 accept
        meta skuid chrony tcp dport 4460 accept
        meta skuid certbot tcp dport { 80, 443 } accept
        socket cgroupv2 level 2 @sysupdate_cgroups tcp dport 443 accept

        # nginx and generic root processes receive no rule for new flows: a
        # static origin may emit only established replies, and the privileged
        # updater is selected by its service cgroup above.

        counter jump reject_output
    }

    chain reject_output {
        meta l4proto tcp reject with tcp reset
        meta l4proto udp reject
        reject
    }
}
