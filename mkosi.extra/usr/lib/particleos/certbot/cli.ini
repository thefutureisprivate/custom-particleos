# Domains, contact email, and ACME account consent are operator supplied.
authenticator = webroot
webroot-path = /var/www/html
preferred-challenges = http
required-profile = shortlived
key-type = ecdsa
elliptic-curve = secp384r1
max-log-backups = 0
deploy-hook = /usr/bin/touch /run/particleos-certbot/reload-request
