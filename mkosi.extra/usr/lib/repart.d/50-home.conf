# Keep administrator storage separate from application state. The partition is
# TPM2 encrypted for metadata confidentiality; systemd-homed adds a second,
# password-backed LUKS boundary around the actual user data.
[Partition]
Type=home
Format=btrfs
SizeMinBytes=1G
SizeMaxBytes=4G
Weight=1000
Encrypt=tpm2
TPM2PCRs=7
FactoryReset=yes
Label=%M-home
