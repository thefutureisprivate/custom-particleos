[Service]
# Fedora 44 labels the systemd-udevd compatibility symlink lib_t rather than
# udev_exec_t. Execute its correctly labelled target directly so SELinux can
# select udev_t; preserve the daemon invocation name expected by udevadm.
ExecStart=
ExecStart=@/usr/bin/udevadm systemd-udevd
