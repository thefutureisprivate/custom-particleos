[Unit]
# The generic failed-unit check runs before boot-complete.target, while the
# stock blessing service necessarily runs after it. If the blessing helper
# itself fails, reboot the counted entry so it cannot remain indefinitely in
# an unblessed, degraded state. Limit this action to boot-counted attempts.
ConditionPathExists=/sys/firmware/efi/efivars/LoaderBootCountPath-4a67b082-0a4c-41cf-b6c7-440b29bb8c4f
FailureAction=reboot

[Service]
# Run only after the stock helper has blessed the counted Type-2 UKI. Cleanup
# is best-effort because boot success must not be reversed after the UKI has
# already been renamed as healthy. Invoke the immutable script through the
# trusted shell so it does not inherit the bootloader executable's narrower
# SELinux transition; widening bootloader_t access to generic ESP files would
# weaken the boundary that protects boot management.
ExecStartPost=-/usr/bin/bash /usr/lib/particleos/retire-installer-boot
