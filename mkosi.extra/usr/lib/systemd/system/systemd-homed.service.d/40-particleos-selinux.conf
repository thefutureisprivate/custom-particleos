[Service]
# systemd-homed mounts the filesystem through a private staging path before
# moving it to /home. Give the filesystem root its final path label at mount
# time so enforcing SELinux never exposes an unlabeled home during login.
Environment=SYSTEMD_HOME_MOUNT_OPTIONS_BTRFS=compress=zstd:1,noacl,user_subvol_rm_allowed,rootcontext=system_u:object_r:user_home_dir_t:s0
