[Unit]
# Socket units normally order before sockets.target. The firewall and module
# lockdown deliberately start after basic.target, so retain fail-closed
# ordering without creating a sockets.target -> basic.target cycle.
DefaultDependencies=no
Requires=nftables.service particleos-module-lockdown.service
After=nftables.service particleos-module-lockdown.service
Before=shutdown.target
Conflicts=shutdown.target

[Socket]
# net.ipv6.bindv6only=1 intentionally disables IPv4-mapped IPv6 sockets.
# Replace Fedora's single wildcard listener with explicit dual-stack sockets.
ListenStream=
ListenStream=0.0.0.0:22
ListenStream=[::]:22
Backlog=16
FreeBind=no
TriggerLimitIntervalSec=60s
TriggerLimitBurst=16
