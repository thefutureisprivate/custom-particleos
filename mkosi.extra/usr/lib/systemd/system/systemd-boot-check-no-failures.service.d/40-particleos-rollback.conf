[Unit]
# An unhealthy counted boot must not sit indefinitely on a broken slot. Reboot
# so systemd-boot consumes the next try and eventually selects the previous
# blessed image. The stock service already orders itself before
# boot-complete.target, so systemd-bless-boot cannot bless this attempt.
ConditionPathExists=/sys/firmware/efi/efivars/LoaderBootCountPath-4a67b082-0a4c-41cf-b6c7-440b29bb8c4f
FailureAction=reboot
