[Unit]
Requires=nftables.service particleos-module-lockdown.service
After=network-online.target nftables.service particleos-module-lockdown.service

[Service]
LockPersonality=yes
MemoryDenyWriteExecute=yes
# Preserve Fedora's init_t -> chronyd_t SELinux transition. The remaining
# capability, filesystem, namespace, and syscall restrictions still apply.
NoNewPrivileges=no
PrivateDevices=yes
PrivateIPC=yes
PrivateTmp=yes
ProtectControlGroups=yes
ProtectHome=yes
ProtectHostname=yes
ProtectKernelLogs=yes
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectSystem=strict
ReadWritePaths=/run /var/lib/chrony
RemoveIPC=yes
Restart=always
RestartMaxDelaySec=10s
RestartSec=100ms
RestartSteps=5
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
SystemCallArchitectures=native
