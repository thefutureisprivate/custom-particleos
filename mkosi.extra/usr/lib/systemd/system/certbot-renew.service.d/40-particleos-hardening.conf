[Unit]
Wants=network-online.target
Requires=nftables.service nginx.service particleos-module-lockdown.service particleos-nginx-reload.path
After=network-online.target nftables.service nginx.service particleos-module-lockdown.service particleos-nginx-reload.path

[Service]
ExecStart=
ExecStart=/usr/bin/certbot --quiet renew --no-random-sleep-on-renew --max-log-backups 0
User=certbot
Group=certbot
Environment=HOME=/var/lib/letsencrypt
CapabilityBoundingSet=
CPUSchedulingPolicy=batch
InaccessiblePaths=/run/systemd/private /run/dbus/system_bus_socket
LockPersonality=yes
MemoryDenyWriteExecute=yes
NoNewPrivileges=yes
PrivateDevices=yes
PrivateIPC=yes
PrivateTmp=yes
ProcSubset=pid
ProtectClock=yes
ProtectControlGroups=yes
ProtectHome=yes
ProtectHostname=yes
ProtectKernelLogs=yes
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectProc=invisible
ProtectSystem=strict
ReadWritePaths=/etc/letsencrypt /var/lib/letsencrypt /var/log/letsencrypt /var/www/html/.well-known/acme-challenge
RemoveIPC=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@keyring @resources
TimeoutStartSec=10min
UMask=0077
