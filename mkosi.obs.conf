# SPDX-License-Identifier: LGPL-2.1-or-later

# OBS provides this public project certificate only for packages carrying
# # needssslcertforbuild. Load upstream mkosi-obs on the aggregate so its
# main-image-only build settings support both signing passes. Complete role
# images select their deferred-signing policy through mkosi.role.obs.conf.
[Match]
PathExists=/usr/src/packages/SOURCES/_projectcert.crt

[Include]
Include=mkosi-obs
