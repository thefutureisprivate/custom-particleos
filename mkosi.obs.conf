# SPDX-License-Identifier: LGPL-2.1-or-later

# OBS provides this public project certificate only for packages carrying
# # needssslcertforbuild. Its presence selects deferred OBS signing and the
# matching publication source; local builds retain direct-signing policy.
[Match]
PathExists=/usr/src/packages/SOURCES/_projectcert.crt

[Include]
Include=mkosi-obs

[Content]
ExtraTrees=%D/mkosi.obs.extra
