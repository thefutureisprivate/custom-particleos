# Immutable nginx defaults and writable certificate state.
L? /etc/nginx
d /etc/letsencrypt 0700 certbot certbot -
C /etc/letsencrypt/cli.ini 0600 certbot certbot - /usr/lib/particleos/certbot/cli.ini
Z /etc/letsencrypt - certbot certbot -
d /var/lib/letsencrypt 0700 certbot certbot -
Z /var/lib/letsencrypt - certbot certbot -
d /var/log/letsencrypt 0700 certbot certbot -
Z /var/log/letsencrypt - certbot certbot -
d /run/particleos-certbot 0750 certbot root -
d /var/lib/particleos/nginx 0700 root root -
d /var/lib/particleos/nginx/conf.d 0700 root root -

# Keep public content on Fedora's standard httpd_sys_content_t path. Certbot's
# systemd sandbox grants write access only to the pre-created challenge leaf.
# The setgid nginx group lets workers read newly created challenge tokens
# without granting them write access.
d /var/www 0755 root root -
d /var/www/html 0755 root root -
d /var/www/html/.well-known 0755 root root -
d /var/www/html/.well-known/acme-challenge 2750 certbot nginx -
C /var/www/html/index.html 0644 root root - /usr/share/nginx/html/index.html
Z /var/www/html - - - -
