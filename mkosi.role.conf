[Validation]
SecureBoot=yes
SignExpectedPcr=no

[Include]
Include=%D/mkosi.role.obs.conf

[Output]
# Exclude PCR artifacts while retaining the inputs for deferred verity signing.
SplitArtifacts=
SplitArtifacts=uki,partitions,roothash,os-release,repart-definitions

[Content]
PostInstallationScripts=
PostInstallationScripts=%D/mkosi.scripts/particleos.install-project-cert
PostInstallationScripts=%D/mkosi.scripts/particleos.postinst.chroot
FinalizeScripts=
FinalizeScripts=%D/mkosi.scripts/particleos.finalize
# mkosi.role.obs.conf appends the OBS signer first when its condition matches.
PostOutputScripts=%D/mkosi.scripts/remove-first-pass-checksum
