[Output]
SplitArtifacts=
SplitArtifacts=uki,partitions,roothash,os-release,repart-definitions
Format=disk
Overlay=no
ManifestFormat=json
RepartDirectories=%D/mkosi.repart
CleanScripts=%D/mkosi.scripts/particleos.clean

[Content]
Bootable=yes
SELinuxRelabel=yes
WithDocs=no
WithRecommends=no
ExtraTrees=%D/mkosi.extra
           %D/mkosi.resources:/usr/lib/particleos/sysupdate-key-source
KernelCommandLine=
        root=dissect
        rootflags=nosuid,nodev
        mount.usr=dissect
        rw
        audit=1
        audit_backlog_limit=8192
        enforcing=1
        selinux=1
        systemd.verity_usr_options=root-hash-signature=auto
        systemd.image_policy=esp=unprotected:xbootldr=unprotected+unused+absent:usr=signed:root=encrypted+absent:swap=encrypted+unused+absent:home=absent:=ignore
        ipe.enforce=1
        slab_nomerge
        init_on_alloc=1
        init_on_free=1
        page_alloc.shuffle=1
        randomize_kstack_offset=on
        module.sig_enforce=1
        rd.shell=0
        rd.emergency=halt
        lockdown=confidentiality
        vsyscall=none
        ia32_emulation=0
        fb_tunnels=none
        noautogroup
KernelInitrdModules=default,-binfmt_misc

RemoveFiles=
        /etc/gnupg
        /etc/profile.d/gnupg2.csh
        /etc/profile.d/gnupg2.sh
        /usr/lib/particleos/sysupdate-key-source
        /usr/bin/arping
