# OBS workers build without network access and provide hardened_malloc and
# no_rlimit_as through the local /.build.binaries package mirror.
[Match]
PathExists=!/.build.binaries

[Build]
SandboxTrees=mkosi.resources/particleos-obs-pubkey.gpg:/usr/share/pki/rpm-gpg/particleos-obs-pubkey.gpg
             mkosi.resources/particleos-obs.repo:/etc/yum.repos.d/particleos-obs.repo
