[Match]
Distribution=fedora
Release=44

[Content]
Packages=
        authselect
        cryptsetup
        fedora-release
        kernel-core
        pam
        policycoreutils
        procps-ng
        selinux-policy-targeted
        systemd-boot
        systemd-networkd
        systemd-networkd-defaults
        systemd-oomd-defaults
        systemd-pam
        systemd-resolved
        tpm2-tss
        veritysetup

VolatilePackages=
        systemd-boot
        systemd-networkd
        systemd-networkd-defaults
        systemd-oomd-defaults
        systemd-pam
        systemd-resolved
