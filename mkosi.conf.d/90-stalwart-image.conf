# The standalone OBS application-image package extracts this reviewed marker
# next to the canonical SCM tree. It builds only the service DDI; the normal OS
# package does not select it and therefore remains independently rebuildable.
[Match]
PathExists=/usr/src/packages/SOURCES/stalwart-image.build

[Config]
Dependencies=
Dependencies=stalwart-service
