# This unpublished directory tree is assembled once and copied into every
# requested role image. Keep package metadata so role images can install their
# small package deltas without reinstalling Fedora or the shared package set.
[Config]
Profiles=

[Output]
Format=directory
Overlay=no
ImageId=ParticleOS-Base
Output=base
ManifestFormat=
SplitArtifacts=

[Content]
Bootable=no
WithDocs=no
WithRecommends=no
SELinuxRelabel=no
CleanPackageMetadata=no
BuildPackages=
ExtraTrees=
RemoveFiles=
PostInstallationScripts=
FinalizeScripts=
PostOutputScripts=
Packages=
        authselect
        bash
        ca-certificates
        chrony
        coreutils
        cryptsetup
        dbus-broker
        fedora-release
        findutils
        gnupg2
        hardened_malloc
        kernel-core
        kmod
        libcurl-minimal
        nftables
        no_rlimit_as
        openssh-server
        pam
        policycoreutils
        polkit
        procps-ng
        sed
        selinux-policy-targeted
        systemd
        systemd-boot
        systemd-container
        systemd-networkd
        systemd-networkd-defaults
        systemd-oomd-defaults
        systemd-pam
        systemd-resolved
        tpm2-tss
        udev
        util-linux
        veritysetup

VolatilePackages=
        systemd
        systemd-boot
        systemd-networkd
        systemd-networkd-defaults
        systemd-oomd-defaults
        systemd-pam
        systemd-resolved
        udev

[Validation]
SecureBoot=no
SignExpectedPcr=no
