[UKIProfile]
Profile=
        ID=install
        TITLE=Installer

# systemd-sysinstall installs the signed partitions and UKI, then the installed
# system asks for credentials on its own first boot. Never embed a password or
# other authentication credential in this transport profile.
Cmdline=
        root=tmpfs
        mount.usr=dissect
        rd.systemd.mask=systemd-repart.service
        systemd.mask=systemd-repart.service
        systemd.mask=systemd-firstboot.service
        systemd.unit=system-install.target
        systemd.mount-extra=/usr/share/factory/etc/selinux:/etc/selinux:none:bind,ro,nosuid,nodev,noexec,x-initrd.mount
        systemd.image_policy=esp=unprotected:xbootldr=unprotected+unused+absent:usr=signed:root=absent:swap=absent:home=absent:=ignore
        systemd.image_filter=usr=ParticleOS-Dnsserver_*:usr-verity=ParticleOS-Dnsserver_*:usr-verity-sig=ParticleOS-Dnsserver_*

SignExpectedPcr=no
