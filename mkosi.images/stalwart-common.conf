# Shared minimal DDI definition. The recovery seed and independently published
# update image supply distinct signed release metadata and image versions.
[Output]
ImageId=ParticleOS-Stalwart
Format=disk
Overlay=no
ElTorito=no
ManifestFormat=json
SplitArtifacts=partitions,roothash,os-release,repart-definitions
RepartDirectories=%D/mkosi.images/stalwart-service/mkosi.repart

[Content]
Bootable=no
Bootloader=none
UnifiedKernelImages=none
CleanPackageMetadata=yes
SELinuxRelabel=yes
WithDocs=no
WithRecommends=no
Packages=
        bash
        ca-certificates
        coreutils
        hardened_malloc
        no_rlimit_as
        policycoreutils
        selinux-policy-targeted
        stalwart
        stalwart-particleos-user
        stalwart-selinux
PostInstallationScripts=%D/mkosi.scripts/stalwart-service.postinst.chroot
FinalizeScripts=%D/mkosi.scripts/stalwart-service.finalize
PostOutputScripts=%D/mkosi.scripts/remove-first-pass-checksum

[Validation]
SecureBoot=no
SignExpectedPcr=no

[Include]
Include=%D/mkosi.service.obs.conf
