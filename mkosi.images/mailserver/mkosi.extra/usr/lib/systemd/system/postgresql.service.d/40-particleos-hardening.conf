[Unit]
Requires=particleos-postgresql-setup.service
After=particleos-postgresql-setup.service

[Service]
# The appliance database has no TCP listener. Its only client is Stalwart over
# the labelled /run/postgresql Unix socket.
CapabilityBoundingSet=
DevicePolicy=closed
IPAddressDeny=any
KeyringMode=private
LockPersonality=yes
MemoryDenyWriteExecute=yes
NoNewPrivileges=yes
# Let postgres assign its socket to the client group without granting Stalwart
# membership in PostgreSQL's own group or state directory.
SupplementaryGroups=stalwart
PrivateDevices=yes
PrivateMounts=yes
PrivateTmp=yes
ProcSubset=pid
ProtectClock=yes
ProtectControlGroups=yes
ProtectHome=yes
ProtectHostname=yes
ProtectKernelLogs=yes
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectProc=invisible
ProtectSystem=strict
ReadWritePaths=/var/lib/pgsql /run/postgresql
RestrictAddressFamilies=AF_UNIX
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
SystemCallArchitectures=native
SystemCallErrorNumber=EPERM
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources
# PostgreSQL changes its Unix socket from postgres:postgres to
# postgres:stalwart. With an empty capability set, DAC limits @chown to files
# owned by postgres and groups in its supplementary group list.
SystemCallFilter=@chown
UMask=0077
