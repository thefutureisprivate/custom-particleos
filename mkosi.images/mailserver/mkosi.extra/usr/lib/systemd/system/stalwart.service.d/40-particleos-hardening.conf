[Unit]
# Do not let a mail listener start before the fail-closed host policy and
# irreversible module lockdown have completed.
Requires=nftables.service particleos-module-lockdown.service postgresql.service particleos-stalwart-database.service systemd-resolved.service
After=nftables.service particleos-module-lockdown.service postgresql.service particleos-stalwart-database.service systemd-resolved.service
StartLimitIntervalSec=5min
StartLimitBurst=5

[Service]
# Keep an unprovisioned PostgreSQL registry in the supported recovery flow.
# The ParticleOS Stalwart build disables this mode automatically only after a
# password-bearing administrator exists, and publishes the selected mode after
# successful datastore migration for the local boot-health gate.
Environment=STALWART_RECOVERY_MODE=1
Environment=PARTICLEOS_AUTO_RECOVERY_MODE=1
Environment=PARTICLEOS_RUNTIME_MODE_FILE=/run/stalwart/particleos-mode
# The health gate owns application-image rollback and participates in the
# generic counted-boot gate. Restart bounded service failures locally so
# transient startup errors can recover before either decision.
Restart=on-failure
RestartSec=10s
# Stalwart has no control-group management role. Mask the hierarchy entirely so
# runtime capacity probes use their normal fallback without widening the
# dedicated SELinux domain's access to cgroup metadata.
InaccessiblePaths=/sys/fs/cgroup
