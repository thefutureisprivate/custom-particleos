[Unit]
# Do not let a mail listener start before the fail-closed host policy and
# irreversible module lockdown have completed.
Requires=nftables.service particleos-module-lockdown.service
After=nftables.service particleos-module-lockdown.service
StartLimitIntervalSec=5min
StartLimitBurst=5

[Service]
# Keep service failures local. An operator enables Stalwart only after its
# external dependencies are ready; a broken mail configuration must not force
# the appliance into a reboot loop during a counted system update.
Restart=on-failure
RestartSec=10s
