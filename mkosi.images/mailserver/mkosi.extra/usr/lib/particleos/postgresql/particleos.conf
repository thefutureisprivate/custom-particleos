# ParticleOS PostgreSQL is an internal implementation detail, never a network
# service. Stalwart connects to the socket using OS-backed peer identity.
listen_addresses = ''
unix_socket_directories = '/run/postgresql'
unix_socket_group = 'stalwart'
unix_socket_permissions = 0770
ssl = off
password_encryption = 'scram-sha-256'
fsync = on
full_page_writes = on
synchronous_commit = on

# Keep the server ready for operator-enabled continuous archiving. Until the
# enable marker is created, the archive helper deliberately returns success so
# PostgreSQL can recycle WAL normally. Once enabled, a missing backup mount is
# fail-safe: archive attempts fail and PostgreSQL retains WAL locally.
wal_level = 'replica'
archive_mode = on
archive_command = '/usr/lib/particleos/postgresql/archive-wal "%p" "%f"'
archive_timeout = '5min'

# Keep service failures in the authenticated system journal instead of a
# postgres-owned mutable log tree which administrators cannot inspect without
# first obtaining a working privileged session.
logging_collector = off
log_destination = 'stderr'
