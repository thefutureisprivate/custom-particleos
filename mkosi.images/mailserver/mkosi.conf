# The role owns a local Unix-socket-only PostgreSQL instance and provisions its
# peer-authenticated Stalwart role without a database secret. Stalwart's
# bootstrap listener remains unreachable from the public firewall.
[Include]
Include=%D/mkosi.role.conf

[Config]
Dependencies=
Dependencies=base,initrd

[Output]
ImageId=ParticleOS-Mailserver
Output=ParticleOS-Mailserver_%v_%a

[Content]
BaseTrees=%O/base
CleanPackageMetadata=yes
BuildPackages=
Initrds=%O/initrd
UnifiedKernelImageFormat=ParticleOS-Mailserver_%v_%a
UnifiedKernelImageProfiles=%D/mkosi.images/mailserver/emergency-uki.conf
KernelCommandLine=systemd.image_filter=usr=ParticleOS-Mailserver_*:usr-verity=ParticleOS-Mailserver_*:usr-verity-sig=ParticleOS-Mailserver_*:root=ParticleOS-Mailserver-*:swap=ParticleOS-Mailserver-*
Hostname=particle-mail-????-????
Packages=
        openssl
        postgresql-server
        stalwart
